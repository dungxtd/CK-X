# containerd mirror config for k3d nodes (k3s registries.yaml).
# Pulls go through the local pull-through caches started by entrypoint.sh;
# k3s falls back to the upstream registry itself if a cache is unreachable.
mirrors:
  "docker.io":
    endpoint:
      - http://k3d-docker-io-mirror:5000
  "registry.k8s.io":
    endpoint:
      - http://k3d-registry-k8s-io-mirror:5000
  "ghcr.io":
    endpoint:
      - http://k3d-ghcr-io-mirror:5000
  "quay.io":
    endpoint:
      - http://k3d-quay-io-mirror:5000
